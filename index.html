<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spinradio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2b2350" id="themec">
<title>Spinradio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: Sunset Drive. Himmel, Sonne und Kulisse füllen den Hintergrund und wechseln pro Sender; Anzeige und Rad als Milchglas darüber. Bewusst ein heller Look in beiden Systemthemen. */
:root{
  --ink:#241433;
  --ink2:rgba(36,20,51,.62);
  --glass:rgba(255,255,255,.44);
  --glass2:rgba(255,255,255,.7);
  --gline:rgba(255,255,255,.8);
  --sky:#2b2350;
  --st:#7a5c9e;
  --sta:color-mix(in srgb,var(--st) 68%,#241433);
  --disp:'Unbounded','Arial Black',system-ui,sans-serif;
  --sans:'Figtree',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--sky);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  height:100%;margin:0;overflow:hidden;
  background:var(--sky);color:var(--ink);font:15px/1.45 var(--sans);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#road{position:fixed;inset:0;width:100%;height:100%;display:block}
.app{position:relative;z-index:1;height:100%;max-width:440px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto auto;gap:14px;padding-block:12px 14px}
.top{display:flex;justify-content:space-between;align-items:center;font:500 12px var(--mono);letter-spacing:.22em;color:#fff;text-shadow:0 1px 8px rgba(36,20,51,.45)}
.brand{font:800 13px var(--disp);letter-spacing:.12em}
.deck{
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--gline);border-radius:22px;padding:12px 14px 6px;
  box-shadow:0 20px 50px -20px rgba(36,20,51,.45);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;
}
.badge{width:52px;height:52px;filter:drop-shadow(0 8px 14px rgba(36,20,51,.25))}
.badge svg{width:100%;height:100%;display:block}
.badge .gl{fill:#241433}
.meta{min-width:0}
.meta.flip{animation:flip .42s cubic-bezier(.2,.9,.3,1)}
@keyframes flip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.freq{margin:0;font:500 11px var(--mono);letter-spacing:.16em;color:var(--ink2)}
h1{margin:2px 0 4px;font:800 clamp(18px,5.6vw,26px)/1 var(--disp);letter-spacing:-.01em;white-space:nowrap}
.genre{margin:0;display:inline-block;padding:2px 8px;border-radius:999px;background:var(--st);color:var(--chip,#fff);font:600 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;transition:background .4s}
.live{margin:5px 0 0;display:flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--ink2);min-width:0}
.live span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;padding:2px 8px;border-radius:999px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink2);color:var(--ink2)}
.pill.on{border-color:#e5484d;color:#fff;background:#e5484d}
.pill.load{border-color:var(--sta);color:var(--sta);animation:blink 1s infinite}
.pill.alt{border-color:#a8641a;color:#a8641a}
@keyframes blink{50%{opacity:.35}}
#eq{grid-column:1/-1;width:100%;height:26px;display:block}
.strip{grid-column:1/-1;position:relative;height:32px;margin-inline:14px;border-top:1.5px solid rgba(36,20,51,.18)}
.tick{position:absolute;top:0;width:1px;height:6px;background:var(--ink);opacity:.25}
.tick.maj{height:11px;opacity:.5}
.lbl{position:absolute;bottom:0;transform:translateX(-50%);font:10px var(--mono);color:var(--ink2)}
.mk{position:absolute;top:9px;width:20px;height:20px;margin-left:-10px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer}
.mk::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.9);transition:transform .2s}
.mk:hover::before,.mk:focus-visible::before{transform:scale(1.5)}
.mk:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:50%}
.needle{position:absolute;top:-8px;bottom:0;left:0;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--sta);transition:left .7s cubic-bezier(.3,1.5,.4,1),opacity .3s,background .4s}
.needle.off{opacity:.2}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;align-items:center}
.dial{
  width:72px;height:72px;border-radius:50%;padding:0;cursor:pointer;
  border:2px solid #fff;background:var(--glass2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--st) 55%,transparent),0 14px 30px -12px rgba(36,20,51,.55);
  display:grid;place-items:center;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:box-shadow .4s,transform .15s;
}
.dial:active{transform:scale(.94)}
.dial svg{width:36px;height:36px;display:block;overflow:visible}
.dial .pw{fill:none;stroke:var(--st);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.dial:focus-visible,.cancel:focus-visible{outline:3px solid #fff;outline-offset:4px}
.hint{margin:0;max-width:34ch;padding:7px 14px;border-radius:14px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--gline);text-align:center;font:400 12px/1.5 var(--sans);color:var(--ink)}

.overlay{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 50%,rgba(255,240,235,.18),rgba(36,20,51,.45));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:opacity .22s;touch-action:none;user-select:none;-webkit-user-select:none;
  padding-block:16px;
}
.overlay.on{opacity:1}
.wheel{
  --sc:#7a5c9e;
  position:relative;width:min(84vw,62vh,500px);aspect-ratio:1;container-type:inline-size;
  transform:scale(.7) rotate(-24deg);transition:transform .5s cubic-bezier(.2,.9,.2,1.12);
}
.overlay.on .wheel{transform:none}
#wsvg{width:100%;height:100%;display:block;overflow:visible}
.seg{transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .2s;cursor:pointer}
.overlay.on .seg{animation:segIn .5s cubic-bezier(.2,.9,.25,1.15) backwards;animation-delay:calc(var(--i)*24ms)}
@keyframes segIn{from{opacity:0;transform:scale(.4) rotate(-30deg)}to{opacity:1;transform:none}}
.seg>path{fill:rgba(255,255,255,.62);fill:color-mix(in srgb,var(--c) 38%,rgba(255,255,255,.62));stroke:rgba(255,255,255,.95);stroke-width:1.5;transition:fill .2s}
.seg .lg{transform-box:fill-box;transform-origin:center;transition:transform .22s cubic-bezier(.3,1.7,.5,1)}
.seg .dot{fill:var(--c);stroke:#fff;stroke-width:1.5;opacity:0;transition:opacity .2s}
.seg.cur .dot{opacity:1}
.seg.sel{transform:scale(1.085)}
.seg.sel>path{fill:var(--c);stroke:#fff;stroke-width:3;filter:drop-shadow(0 8px 14px rgba(36,20,51,.35))}
.seg .gl{fill:#241433;stroke:none}
#ptr{transform-origin:0 0;transition:transform .3s cubic-bezier(.3,1.5,.5,1);fill:var(--sc);stroke:#fff;stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 3px 5px rgba(36,20,51,.45))}
.hubdisc{fill:rgba(255,255,255,.88);stroke:var(--sc);stroke-width:4;transition:stroke .2s}
.hub{position:absolute;left:50%;top:50%;width:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.hub.flip{animation:hubflip .25s cubic-bezier(.2,.9,.3,1)}
@keyframes hubflip{from{opacity:0;transform:translate(-50%,calc(-50% + 6px))}to{opacity:1;transform:translate(-50%,-50%)}}
.hub-g{margin:0;font:600 3cqw var(--sans);letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--sc) 65%,#241433)}
.hub-n{margin:1cqw 0;font:800 6.6cqw/1 var(--disp);white-space:nowrap;color:var(--ink)}
.hub-f{margin:0;font:500 3cqw var(--mono);letter-spacing:.12em;color:var(--ink2)}
.hub-l{margin:.8cqw auto 0;max-width:82%;font:400 2.8cqw/1.35 var(--sans);color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-wrap:balance}
.cancel{width:44px;height:44px;display:grid;place-items:center;font:600 18px/1 var(--sans);color:var(--ink);background:var(--glass2);border:1px solid #fff;border-radius:50%;padding:0;cursor:pointer;box-shadow:0 10px 24px -12px rgba(36,20,51,.5)}
.mono{font:800 15px var(--disp);letter-spacing:-.02em}

@media (prefers-reduced-motion:reduce){
  .wheel{transform:none!important;transition:none}
  .overlay.on .seg{animation:none}
  .meta.flip,.hub.flip{animation:none}
  .needle{transition:none}
}

.right{display:flex;align-items:center;gap:12px}
.moon{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--gline);color:#fff;font:500 11px var(--mono);letter-spacing:.12em;text-shadow:none;-webkit-tap-highlight-color:transparent}
.moon svg{width:14px;height:14px;fill:currentColor}
.moon:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sleepmenu{position:fixed;z-index:30;top:calc(env(safe-area-inset-top) + 52px);right:16px;width:min(260px,calc(100vw - 32px));padding:14px;border-radius:18px;background:rgba(36,20,51,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gline);color:#fff;font:500 13px var(--sans)}
.sleepmenu h2{margin:0 0 10px;font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.sleepmenu .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sleepmenu button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid transparent;-webkit-tap-highlight-color:transparent}
.sleepmenu button[aria-pressed="true"]{border-color:#fff;background:rgba(255,255,255,.22)}
.sleepmenu button:focus-visible{outline:2px solid #fff}
.sleepmenu .var{margin:0 0 12px;padding:10px 10px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
.sleepmenu .var label{display:flex;justify-content:space-between;font:500 11px var(--mono);letter-spacing:.08em;opacity:.85;margin-bottom:8px}
.sleepmenu .var b{font-weight:700;color:#ffc83d}
.sleepmenu input[type=range]{all:unset;display:block;width:100%;height:28px;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.sleepmenu input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
.sleepmenu input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#ffc83d;border:2px solid #241433}
.sleepmenu input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
.sleepmenu input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#ffc83d;border:2px solid #241433}
.sleepmenu input[type=range]:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:6px}
.sleepmenu .vgo{display:block;width:100%;margin-top:4px;background:rgba(255,255,255,.2)}
.sleepmenu .go{display:block;width:100%;background:#ffc83d;color:#241433;font-weight:700}
.sleepmenu .note{margin:10px 0 0;font-size:11px;opacity:.7;line-height:1.35}
.sleepdark{position:fixed;inset:0;z-index:50;background:transparent;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom) + 40px);color:#fff;font:400 12px var(--mono);letter-spacing:.14em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sleepdark .blind{position:absolute;left:0;right:0;top:0;height:100%;background:repeating-linear-gradient(to bottom,#000 0 11px,#120d1a 11px 15px);box-shadow:0 8px 22px 4px rgba(0,0,0,.75);transform:translate3d(0,-101%,0);will-change:transform;backface-visibility:hidden;transition:transform 8s cubic-bezier(.45,0,.55,1)}
.sleepdark .blind::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#2a2036}
.sleepdark.sd-done{background:#000}
.sleepdark.sd-done .blind{display:none}
.sleepdark.sd-done span{transition:none}
body.asleep .app,body.asleep #road{visibility:hidden}
.sleepdark span{position:relative;opacity:0;transition:opacity 1.2s}
.sleepdark.sd-hint span{opacity:.35}
</style>
</head>
<body>
<canvas id="road" aria-hidden="true"></canvas>
<main class="app">
  <header class="top"><span class="brand">SPINRADIO</span><span class="right"><button class="moon" id="moon" aria-haspopup="true" aria-expanded="false" aria-label="Sleep-Timer und Schlafmodus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg><span id="moont">SLEEP</span></button><span id="clock">--:--</span></span></header>
  <div></div>
  <section class="deck" aria-live="polite">
    <div class="badge" id="badge"></div>
    <div class="meta" id="meta">
      <p class="freq"><span id="freq">--.-</span> FM</p>
      <h1 id="sname">Radio aus</h1>
      <p class="genre" id="sgenre">Knopf halten, Sender wählen</p>
      <p class="live" id="lrow" hidden><b class="pill" id="lpill">Live</b><span id="lname"></span></p>
    </div>
    <canvas id="eq" aria-hidden="true"></canvas>
    <div class="strip" id="strip"><i class="needle off" id="needle"></i></div>
  </section>
  <footer class="ctrl">
    <div class="row">
      <button class="dial" id="dial" aria-label="Sender wählen: halten und zum Sender ziehen, oder tippen">
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><path class="pw" d="M-6.3-6.3a9 9 0 1 0 12.6 0M0-10.5V-1.5"/></svg>
      </button>    </div>
    <p class="hint">Halten und zum Sender ziehen, oder tippen. Aus: unten im Rad.</p>
    <audio id="player" preload="none" playsinline referrerpolicy="no-referrer"></audio>
  </footer>
</main>

<div class="sleepmenu" id="smenu" hidden role="dialog" aria-label="Sleep-Timer">
  <h2>Sleep-Timer</h2>
  <div class="opts" id="sopts"></div>
  <div class="var"><label for="svar">Eigene Dauer <b id="svlab">20 min</b></label><input type="range" id="svar" min="5" max="180" step="5" value="20" aria-label="Eigene Dauer in Minuten"><button class="vgo" id="svgo">Timer starten</button></div>
  <button class="go" id="sdark">Bildschirm ausschalten</button>
  <p class="note">Das Radio spielt weiter. Zum Aufwecken auf den Bildschirm tippen. Mit Timer wird es zum Schluss langsam leiser und geht dann aus.</p>
</div>
<div class="sleepdark" id="sdarkov" hidden role="button" aria-label="Aufwecken"><div class="blind" id="blind"></div><span>TIPPEN ZUM AUFWECKEN</span></div>

<div class="overlay" id="ov" hidden>
  <div class="wheel" id="wheel">
    <svg id="wsvg" viewBox="-206 -206 412 412" aria-hidden="true"></svg>
    <div class="hub" id="hub"><p class="hub-g" id="hg"></p><p class="hub-n" id="hn"></p><p class="hub-f" id="hf"></p><p class="hub-l" id="hl"></p></div>
  </div>
  <button class="cancel" id="cancel" type="button" aria-label="Abbrechen">✕</button>
</div>

<script>
(()=>{

const $=s=>document.querySelector(s);
const root=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

 {name:'Sol y Calle',genre:'Latin',mono:'SC',shape:'pent',color:'#ff8a2b',freq:100.9,tempo:98,swing:0,key:45,

function poly(n,r,rot){ const p=[]; for(let k=0;k<n;k++){ const a=((rot||0)+k*360/n)*Math.PI/180; p.push((r*Math.sin(a)).toFixed(1)+','+(-r*Math.cos(a)).toFixed(1)); } return `<polygon points="${p.join(' ')}"/>`; }
function shapeSvg(k,r){
  switch(k){
    case 'circle': return `<circle r="${r}"/>`;
    case 'hex': return poly(6,r*1.08,0);
    case 'square': return `<rect x="${-r*.92}" y="${-r*.92}" width="${r*1.84}" height="${r*1.84}" rx="5"/>`;
    case 'tri': return `<g transform="translate(0,4)">${poly(3,r*1.25,0)}</g>`;
    case 'diamond': return poly(4,r*1.2,0);
    case 'oct': return poly(8,r*1.05,22.5);
    case 'pent': return poly(5,r*1.1,0);
    case 'star': { const p=[]; for(let k=0;k<16;k++){ const rr=k%2?r*.86:r*1.14,a=k*22.5*Math.PI/180; p.push((rr*Math.sin(a)).toFixed(1)+','+(-rr*Math.cos(a)).toFixed(1)); } return `<polygon points="${p.join(' ')}"/>`; }
  } return '';
}
function logo(st){
  const dy=st.shape==='tri'?6:1.5;
  return `<g fill="${st.color}">${shapeSvg(st.shape,24)}</g><text class="mono" y="${dy}" text-anchor="middle" dominant-baseline="central" fill="#0a0d12">${st.mono}</text>`;
}

const P=(rad,deg)=>{ const t=deg*Math.PI/180; return [rad*Math.sin(t),-rad*Math.cos(t)]; };
const f2=n=>n.toFixed(2);
function wedge(i){
  const c=i*STEP+ROT,a0=c-STEP/2+GAP/2,a1=c+STEP/2-GAP/2;
  const [x0,y0]=P(R,a0),[x1,y1]=P(R,a1),[x2,y2]=P(R0,a1),[x3,y3]=P(R0,a0);
  return `M${f2(x0)},${f2(y0)}A${R},${R} 0 0 1 ${f2(x1)},${f2(y1)}L${f2(x2)},${f2(y2)}A${R0},${R0} 0 0 0 ${f2(x3)},${f2(y3)}Z`;
}

for(let i=0;i<N;i++){
  const st=ST[i],col=st?st.color:'#b9a8d6';
  const [lx,ly]=P((R+R0)/2,i*STEP+ROT),[dx,dy]=P(R-9,i*STEP+ROT);
  html+=`<g class="seg" data-i="${i}" style="--c:${col};--i:${i}"><path d="${wedge(i)}"/><g transform="translate(${f2(lx)},${f2(ly)})"><g class="lg">${st?wlogo(st):OFFLOGO}</g></g><circle class="dot" r="3" cx="${f2(dx)}" cy="${f2(dy)}"/></g>`;
}

function fitText(el){
  el.style.fontSize='';

  let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
  while(el.scrollWidth>el.clientWidth+1&&fs>10&&n++<40){ fs-=1; el.style.fontSize=fs+'px'; }
}
let wheelOpen=false,sel=OFF,tapMode=false,holdPid=null,tOpen=0;
function hubFor(k){ const st=ST[k]; return st?{n:st.name,g:st.genre,f:st.freq.toFixed(1)+' FM',l:LIVE[k][0].n,c:st.color}:{n:'Radio aus',g:'Stille',f:'—',l:'',c:'#7a5c9e'}; }
function paintWheel(){
  segs.forEach((g,k)=>{ g.classList.toggle('sel',k===sel); g.classList.toggle('cur',k===(cur<0?OFF:cur)&&cur>=0); });
  const h=hubFor(sel);
  $('#hg').textContent=h.g; $('#hn').textContent=h.n; $('#hf').textContent=h.f; $('#hl').textContent=h.l; wheel.style.setProperty('--sc',h.c);
  { const tg=sel*STEP+ROT; if(pa===null){ ptr.style.transition='none'; pa=tg; ptr.style.transform=`rotate(${pa}deg)`; void ptr.getBoundingClientRect(); ptr.style.transition=''; } else { pa+=((tg-pa+540)%360)-180; ptr.style.transform=`rotate(${pa}deg)`; } }
  fitText($('#hn'));
  hub.classList.remove('flip'); void hub.offsetWidth; hub.classList.add('flip');
}
function select(i){
  if(i===sel) return; sel=i; paintWheel(); tick();

}
function openWheel(){
  if(wheelOpen) return; wheelOpen=true; tOpen=performance.now();

}
function closeWheel(){
  if(!wheelOpen) return; wheelOpen=false; tapMode=false; ov.classList.remove('on');
  setTimeout(()=>{ if(!wheelOpen) ov.hidden=true; },240);
}
function confirmSel(){ try{ navigator.vibrate&&navigator.vibrate([14,30,14]); }catch(e){} const i=sel; closeWheel(); setStation(i<ST.length?i:-1); }
function idxFromPoint(x,y){
  const r=svg.getBoundingClientRect(); const dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2);
  if(Math.hypot(dx,dy)/(r.width/2)<.2) return null;
  let a=Math.atan2(dx,-dy)*180/Math.PI-ROT; a=((a%360)+360)%360;
  return Math.round(a/STEP)%N;
}

const dial=$('#dial'); let t0=0,moved=false;

dial.addEventListener('pointerdown',e=>{
  e.preventDefault(); ensureAudio(); holdPid=e.pointerId; t0=performance.now(); moved=false;
  try{ dial.setPointerCapture(e.pointerId); }catch(err){}
  openWheel();
});
dial.addEventListener('pointermove',e=>{
  if(holdPid!==e.pointerId) return;
  const i=idxFromPoint(e.clientX,e.clientY); if(i!==null){ moved=true; select(i); }
});
dial.addEventListener('pointerup',e=>{
  if(holdPid!==e.pointerId) return; holdPid=null;
  ensureAudio(); // iPhone gibt Ton erst beim Loslassen frei

});

  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(wheelOpen) confirmSel(); else { ensureAudio(); openWheel(); tapMode=true; } }
});
ov.addEventListener('pointermove',e=>{
  if(!wheelOpen||holdPid!==null) return; const i=idxFromPoint(e.clientX,e.clientY); if(i!==null) select(i);
});
ov.addEventListener('click',e=>{
  if(e.target.closest('#cancel')||performance.now()-tOpen<400) return;
  const r=svg.getBoundingClientRect();
  const d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))/(r.width/2);
  if(d>1.15){ closeWheel(); return; }
  const i=idxFromPoint(e.clientX,e.clientY); if(i!==null){ sel=i; paintWheel(); confirmSel(); }
});
$('#cancel').addEventListener('click',()=>closeWheel());

/* Tastatur: Q halten wie im Spiel */
let qHeld=false;
addEventListener('keydown',e=>{
  const k=e.key;
  if((k==='q'||k==='Q')&&!e.repeat&&!wheelOpen){ ensureAudio(); qHeld=true; openWheel(); return; }
  if(wheelOpen){
    if(k==='ArrowRight'||k==='ArrowDown'){ select((sel+1)%N); e.preventDefault(); }
    else if(k==='ArrowLeft'||k==='ArrowUp'){ select((sel+N-1)%N); e.preventDefault(); }
    else if(k==='Escape'){ closeWheel(); }
  } else if(k==='ArrowRight'){ stepSt(1); } else if(k==='ArrowLeft'){ stepSt(-1); }
});
addEventListener('keyup',e=>{ if((e.key==='q'||e.key==='Q')&&qHeld){ qHeld=false; if(wheelOpen) confirmSel(); } });

    break; }
  case 'bridge': { // Autos auf der Bruecke, Schiff darunter
    const dk=hy-H*.035;
    for(let i=0;i<6;i++){ const dir=i%2?1:-1, u=((T*.06*(.8+.2*(i%3))+i*.17)%1), x=dir>0?u*W:W-u*W, y=dk-(dir>0?2:5);
      rx.fillStyle=dir>0?'rgba(255,245,210,.95)':'rgba(255,70,70,.95)'; rx.fillRect(x+dir*3,y,2.4,2.4); rx.fillStyle=dir>0?'rgba(255,70,70,.9)':'rgba(255,245,210,.95)'; rx.fillRect(x-dir*3,y,2.4,2.4); }
    { const u=(T/34)%1, x=W*1.12-u*W*1.3, y=hy+H*.018;
      rx.fillStyle=cs; rx.beginPath(); rx.moveTo(x-38,y); rx.lineTo(x+38,y); rx.lineTo(x+30,y+9); rx.lineTo(x-32,y+9); rx.fill(); rx.fillRect(x-14,y-10,24,10); rx.fillRect(x-4,y-17,8,7);
      rx.fillStyle='rgba(255,214,120,.9)'; for(let k=0;k<5;k++) rx.fillRect(x-30+k*12,y+2,3,2.5); if(Math.sin(T*3)>-.2){ rx.fillStyle='#fff'; rx.beginPath(); rx.arc(x,y-19,1.8,0,6.283); rx.fill(); } }
    break; }
  case 'hills': { // Wolken und ein Heissluftballon
    for(let i=0;i<3;i++){ const x=((T*.012+i*.37)%1.3-.15)*W, y=hy*(.22+.17*i); rx.fillStyle='rgba(255,255,255,.55)'; rx.beginPath(); rx.arc(x,y,13,0,6.283); rx.arc(x+16,y-4,17,0,6.283); rx.arc(x+34,y,12,0,6.283); rx.fill(); }
    const w=win(30,22,5); if(w){ const x=W*.3+w.u*W*.38+Math.sin(T*.8)*5, y=hy+30-w.u*(hy+60);
      rx.fillStyle='#e8553c'; rx.beginPath(); rx.arc(x,y,14,0,6.283); rx.fill(); rx.fillStyle='#ffd23f'; rx.beginPath(); rx.arc(x,y,14,-.9,.9); rx.lineTo(x,y); rx.fill();
      rx.strokeStyle=cs; rx.lineWidth=1; rx.beginPath(); rx.moveTo(x-9,y+10); rx.lineTo(x-4,y+22); rx.moveTo(x+9,y+10); rx.lineTo(x+4,y+22); rx.stroke(); rx.fillStyle=cs; rx.fillRect(x-5,y+22,10,6); }
    break; }
  case 'discoball': { // Lichtpunkte auf der Tanzflaeche und Laser
    for(let i=0;i<6;i++){ const x=W/2+Math.cos(T*.6+i*1.047)*W*.36, y=hy+(H-hy)*(.35+.3*(Math.sin(T*.4+i)*.5+.5)); rx.fillStyle=`hsla(${i*60+T*20},95%,70%,.5)`; rx.beginPath(); rx.ellipse(x,y,24,6,0,0,6.283); rx.fill(); }
    [[0,'rgba(120,255,255,.55)',1],[W,'rgba(255,120,220,.55)',-1]].forEach(([x0,c,d])=>{ const an=-Math.PI/2+d*(.8+Math.sin(T*1.3)*.55); rx.strokeStyle=c; rx.lineWidth=1.5; rx.beginPath(); rx.moveTo(x0,hy*.9); rx.lineTo(x0+Math.cos(an)*W*1.2,hy*.9+Math.sin(an)*W*1.2); rx.stroke(); });
    break; }
  case 'mountains': { // Gluehwuermchen und Sternschnuppen
    for(let i=0;i<14;i++){ const x=W*RN(i,1)+Math.sin(T*.4+i)*14, y=hy-H*.03+RN(i,2)*H*.2+Math.cos(T*.5+i*2)*8, al=.5+.5*Math.sin(T*2+i*3);
      rx.fillStyle=`rgba(220,255,140,${.18*al})`; rx.beginPath(); rx.arc(x,y,6,0,6.283); rx.fill(); rx.fillStyle=`rgba(235,255,170,${.95*al})`; rx.beginPath(); rx.arc(x,y,1.8,0,6.283); rx.fill(); }
    shoot(10,3,hy); break; }
  case 'beach': { // Konfetti und Schaumkrone der Wellen
    for(let i=0;i<40;i++){ const x=W*RN(i,1)+Math.sin(T+i)*10, y=((T*.07*(.7+.6*RN(i,3))+RN(i,2))%1)*H*.6;
      rx.save(); rx.translate(x,y); rx.rotate(T*3+i); rx.fillStyle=rgb(PAL[i%5],.9); rx.fillRect(-2.5,-1.2,5,2.4); rx.restore(); }
    rx.strokeStyle='rgba(255,255,255,.6)'; rx.lineWidth=2; rx.beginPath(); for(let x=0;x<=W;x+=10){ const y=hy+H*.04+Math.sin(x*.03+T*1.2)*3+Math.sin(T*.5)*H*.008; x?rx.lineTo(x,y):rx.moveTo(x,y); } rx.stroke();
    break; }
  case 'bremen': { // Moewen ueber der Weser
    for(let i=0;i<3;i++){ const x=W*(.3+i*.12)+Math.cos(T*.32+i*2.1)*W*.14, y=hy-H*.16-i*H*.018+Math.sin(T*.6+i*1.7)*H*.02; gull(x,y,5.5,T*6.5+i*2,cs); }
    break; }
  case 'jazz': { // Noten steigen aus dem Fenster, Rauch der Zigarette
    { const u=H*.016, sx=W*.3+u*3.9, sy=hy+H*.13-u*6.7; for(let k=0;k<7;k++){ const t=((T/6+k/7)%1); rx.fillStyle=`rgba(230,230,245,${.22*(1-t)})`; rx.beginPath(); rx.arc(sx+Math.sin(t*7+k)*u*1.2+t*u*2,sy-t*u*9,u*(.35+t*1.3),0,6.283); rx.fill(); } }
    rx.fillStyle='rgba(255,225,170,1)'; rx.font=`${Math.max(14,W*.05)}px sans-serif`; rx.textAlign='center';
    for(let i=0;i<4;i++){ const u=((T/9+i/4)%1), x=W*(.1+.06*i)+Math.sin(u*6+i*2)*W*.03+u*W*.1, y=hy-H*.03-u*H*.22; rx.globalAlpha=a*Math.sin(u*Math.PI)*.85; rx.fillText(i%2?'\u266B':'\u266A',x,y); }
    break; }
  case 'lighthouse': { // Schiff am Horizont und ziehender Nebel
    for(let i=0;i<3;i++){ const x=((T*.01+i*.4)%1.4-.2)*W; rx.fillStyle='rgba(255,255,255,.05)'; rx.beginPath(); rx.ellipse(x,hy-H*.01+i*H*.012,W*.35,H*.014,0,0,6.283); rx.fill(); }
    { const u=(T/45)%1, x=-30+u*(W+60), y=hy+H*.006; rx.fillStyle=cs; rx.fillRect(x-14,y-5,28,5); rx.fillRect(x-5,y-10,9,5);
      if(Math.sin(T*2.5)>-.2){ rx.fillStyle='#ffd877'; rx.beginPath(); rx.arc(x,y-12,2,0,6.283); rx.fill(); } }
    break; }
  }
  rx.restore();
}
function avgLevel(){ let s=0,n=0; for(const v of lev){ s+=v||0; n++; } return n?s/n:0; }
function drawLand(){
  const hy=H*.42;
  const g=rx.createLinearGradient(0,0,0,hy); g.addColorStop(0,rgb(now.sky[0])); g.addColorStop(.6,rgb(now.sky[1])); g.addColorStop(1,rgb(now.sky[2]));
  rx.fillStyle=g; rx.fillRect(0,0,W,hy+1);
  // Sterne und Glitzer
  if(starA>.01){ stars.forEach(s=>{ rx.fillStyle=`rgba(255,255,255,${starA*(.35+.45*Math.sin(T*2+s.p))})`; rx.beginPath(); rx.arc(s.x*W,s.y*hy*.8,s.r,0,6.283); rx.fill(); }); }
  // Sonne
  const R=Math.min(W,H)*.19, sy=hy+R*.1-R*.6*now.y, sx=W/2, pulse=1+avgLevel()*.12;
  const glow=rx.createRadialGradient(sx,sy,R*.4,sx,sy,R*2.6*pulse); glow.addColorStop(0,rgb(now.sun[1],.55)); glow.addColorStop(1,rgb(now.sun[1],0));
  rx.fillStyle=glow; rx.fillRect(0,0,W,hy);
  rx.save(); rx.beginPath(); rx.rect(0,0,W,hy);
  rx.clip();
  const sg=rx.createLinearGradient(0,sy-R,0,sy+R); sg.addColorStop(0,rgb(now.sun[0])); sg.addColorStop(1,rgb(now.sun[1]));
  rx.fillStyle=sg; rx.beginPath(); rx.arc(sx,sy,R,0,6.283); rx.fill();
  rx.restore();
  SUN={x:sx,y:sy,r:R};
  if(sparkA>.01){ glints.forEach(s=>{ const k=Math.max(0,Math.sin(T*2.2*s.s+s.p)); if(k<.05) return; const x=s.x*W,y=s.y*hy,L=6+10*k;
    rx.strokeStyle=`rgba(255,255,255,${sparkA*k})`; rx.lineWidth=1.6; rx.beginPath(); rx.moveTo(x-L,y); rx.lineTo(x+L,y); rx.moveTo(x,y-L); rx.lineTo(x,y+L); rx.stroke(); }); }
  // Boden und Kulisse (überblendet)
  drawGround(groundA,hy,1-sceneT); drawGround(groundB,hy,sceneT);
  drawScene(sceneA,hy,1-sceneT); drawScene(sceneB,hy,sceneT);
  drawExtra(sceneA,hy,1-sceneT); drawExtra(sceneB,hy,sceneT);
  drawSantaFlight((sceneA==='xmas'?1-sceneT:0)+(sceneB==='xmas'?sceneT:0));
  if(snowA>.01){ rx.fillStyle=`rgba(255,255,255,${.85*snowA})`; flakes.forEach(f=>{ rx.beginPath(); rx.arc(f.x*W,f.y*H,f.r,0,6.283); rx.fill(); }); }
}
function drawEq(){
  ex.clearRect(0,0,EW,EH);
  const nb=Math.max(16,Math.floor(EW/10)),bw=EW/nb,synth=analyser&&cur>=0&&playing,stream=mode==='live'&&!player.paused;
  if(synth) analyser.getByteFrequencyData(fd);
  if(stream&&performance.now()-fakeT>110){ fakeT=performance.now(); for(let k=0;k<nb;k++){ const tilt=1-.55*(k/nb); fake[k]=tilt*(.25+.75*Math.random()*Math.random()+.15*Math.random()); } }
  ex.fillStyle=getComputedStyle(root).getPropertyValue('--st').trim()||'#7a5c9e';
  for(let k=0;k<nb;k++){
    const v=synth?fd[Math.floor(2+Math.pow(k/nb,1.7)*84)]/255:stream?(fake[k]||0)*.85:0;
    lev[k]=(lev[k]||0)+(v-(lev[k]||0))*.4;
    const h=Math.max(3,lev[k]*EH*.96), x=k*bw+1.5, w=bw-3;
    ex.globalAlpha=.55+.45*lev[k];
    ex.beginPath(); if(ex.roundRect) ex.roundRect(x,EH-h,w,h,Math.min(3,w/2)); else ex.rect(x,EH-h,w,h); ex.fill();
  }
  ex.globalAlpha=1;
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||.016); last=ts;
  if(!reduce){ T+=dt; phase=(phase+dt*(wheelOpen?.08:cur<0?.25:.6))%1; }
  const k=reduce?1:Math.min(1,dt*2.2);
  for(let i=0;i<3;i++){ now.sky[i]=mix(now.sky[i],goal.sky[i],k); }
  for(let i=0;i<2;i++){ now.sun[i]=mix(now.sun[i],goal.sun[i],k); }
  now.y=lerp(now.y,goal.y,k);
  sceneT=reduce?1:Math.min(1,sceneT+dt*1.2);
  starA=lerp(starA,starG,k); sparkA=lerp(sparkA,sparkG,k); snowA=lerp(snowA,snowG,k);
  if(snowA>.01&&!reduce) flakes.forEach(f=>{ f.y+=f.v*dt; f.x+=Math.sin(T*.8+f.p)*dt*.012; if(f.y>1){ f.y=-.02; f.x=Math.random(); } });
  if(!asleep){ drawLand(); drawEq(); } requestAnimationFrame(loop);
}

/* ---------- Sleep-Timer und Schlafmodus ---------- */
let sleepEnd=0,sleepMin=0,sleepTick=null,sleepFade=null,asleep=false,hintT=null;
const smenu=$('#smenu'),moon=$('#moon'),moont=$('#moont'),sdarkov=$('#sdarkov'),sopts=$('#sopts');
[[0,'Aus'],[15,'15 min'],[30,'30 min'],[45,'45 min'],[60,'60 min'],[90,'90 min']].forEach(([m,l])=>{
  const b=document.createElement('button'); b.textContent=l; b.dataset.m=m; b.setAttribute('aria-pressed',m===0?'true':'false');
  b.addEventListener('click',()=>{ setSleep(m); }); sopts.appendChild(b);
});
const svar=$('#svar'),svlab=$('#svlab'),svgo=$('#svgo');
function fmtMin(m){ return m<60?m+' min':(Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'')); }
svar.addEventListener('input',()=>{ svlab.textContent=fmtMin(+svar.value); });
svgo.addEventListener('click',()=>{ setSleep(+svar.value); });
function paintSleepBtns(){ sopts.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.m===sleepMin))); }
function fmtLeft(ms){ const s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60),p=n=>String(n).padStart(2,'0'); return m>=60?Math.floor(m/60)+':'+p(m%60)+':'+p(s%60):m+':'+p(s%60); }
function sleepLabel(){ moont.textContent=sleepEnd?fmtLeft(sleepEnd-Date.now()):'SLEEP'; }
function resetVol(){ clearInterval(sleepFade); sleepFade=null; try{ player.volume=curTrim; }catch(e){} if(master&&ctx) master.gain.value=.55; }
function setSleep(m){
  clearInterval(sleepTick); resetVol(); sleepMin=m; paintSleepBtns();
  if(!m){ sleepEnd=0; stopSleepWorker(); sleepLabel(); return; }
  svar.value=m>=5&&m<=180?m:svar.value; svlab.textContent=fmtMin(+svar.value);
  sleepEnd=Date.now()+m*60000; sleepLabel();
  sleepTick=setInterval(sleepCheck,1000); startSleepWorker();
}
/* Der Timer darf nicht nur an setInterval hängen: Handy gesperrt/App im Hintergrund = Seite wird gedrosselt oder eingefroren.
   Darum wird die Zeit (Date.now) an mehreren Stellen geprüft: Intervall, Worker-Takt, Audio-Takt, Rückkehr in den Vordergrund. */
function sleepCheck(){
  if(!sleepEnd) return;
  const left=sleepEnd-Date.now(); sleepLabel();
  if(left>0) return;
  clearInterval(sleepTick); stopSleepWorker(); sleepEnd=0; sleepMin=0; paintSleepBtns(); sleepLabel();
  if(document.hidden){ resetVol(); setStation(-1); } else fadeOutEnd();
}
let sleepWorker=null;
function startSleepWorker(){
  stopSleepWorker();
  try{
    const u=URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},1000)'],{type:'text/javascript'}));
    sleepWorker=new Worker(u); sleepWorker.onmessage=sleepCheck; URL.revokeObjectURL(u);
  }catch(e){ sleepWorker=null; }
}
function stopSleepWorker(){ if(sleepWorker){ try{ sleepWorker.terminate(); }catch(e){} sleepWorker=null; } }
player.addEventListener('timeupdate',sleepCheck);
document.addEventListener('visibilitychange',sleepCheck);
addEventListener('pageshow',sleepCheck);
addEventListener('focus',sleepCheck);
function fadeOutEnd(){
  let k=0; const N=20;
  clearInterval(sleepFade);
  sleepFade=setInterval(()=>{
    k++; const v=Math.max(0,1-k/N);
    try{ player.volume=curTrim*v; }catch(e){}
    if(master&&ctx) master.gain.value=.55*v;
    if(k>=N){ resetVol(); setStation(-1); sleepLabel(); }
  },500);
}
function openSMenu(o){ smenu.hidden=!o; moon.setAttribute('aria-expanded',String(o)); }
moon.addEventListener('click',e=>{ e.stopPropagation(); openSMenu(smenu.hidden); });
document.addEventListener('pointerdown',e=>{ if(!smenu.hidden&&!smenu.contains(e.target)&&!moon.contains(e.target)) openSMenu(false); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!smenu.hidden) openSMenu(false); });
let blindT=null;
function goDark(){
  openSMenu(false); sdarkov.hidden=false; sdarkov.classList.remove('sd-hint','sd-done'); document.body.classList.remove('asleep');
  const bl=$('#blind'), fin=()=>{ asleep=true; document.body.classList.add('asleep'); sdarkov.classList.add('sd-done','sd-hint'); document.getElementById('themec').content='#000000'; clearTimeout(hintT); hintT=setTimeout(()=>sdarkov.classList.remove('sd-hint'),3500); };
  clearTimeout(blindT);
  if(reduce){ bl.style.transition='none'; bl.style.transform='translate3d(0,0,0)'; fin(); return; }
  bl.style.transition='none'; bl.style.transform='translate3d(0,-101%,0)'; void bl.offsetHeight;
  bl.style.transition=''; bl.style.transform='translate3d(0,0,0)';
  blindT=setTimeout(fin,8100);
}
function wake(){ clearTimeout(blindT); clearTimeout(hintT); asleep=false; document.body.classList.remove('asleep'); sdarkov.hidden=true; sdarkov.classList.remove('sd-hint','sd-done'); const bl=$('#blind'); bl.style.transition='none'; bl.style.transform='translate3d(0,-101%,0)'; document.getElementById('themec').content='#2b2350'; }
$('#sdark').addEventListener('click',goDark);
sdarkov.addEventListener('click',wake);
sdarkov.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') wake(); });

fit(); paintDeck(); paintWheel(); requestAnimationFrame(loop);
const refit=()=>{ fitText($('#sname')); if(wheelOpen) fitText($('#hn')); };
try{ document.fonts.ready.then(refit); }catch(e){}
addEventListener('resize',refit);
})();
